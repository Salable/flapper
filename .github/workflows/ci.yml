name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests
    # The suite deliberately needs no Electron and no display, so it runs on
    # Linux in seconds rather than burning macOS minutes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # No runtime dependencies, so this only installs Electron and the
      # packager. --ignore-scripts skips Electron's binary download, which the
      # tests never touch.
      - run: npm ci --ignore-scripts

      - run: npm test

  assets:
    name: Tile art is reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      # assets/ is committed so a clone runs with no build step. That only stays
      # true if the manifest keeps matching what the app expects, so check the
      # shape rather than trusting it.
      - name: Check the manifest describes a closed ring
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const m = JSON.parse(readFileSync("assets/manifest.json", "utf8"));
            const { cycle } = m;
            if (!Array.isArray(cycle) || cycle.length === 0) throw new Error("empty cycle");
            const names = cycle.map((s) => s.name);
            const seen = new Set(names);
            if (seen.size !== names.length) throw new Error("duplicate states in the ring");
            for (let i = 0; i < cycle.length; i += 1) {
              const next = cycle[(i + 1) % cycle.length];
              if (cycle[i].to !== next.name) {
                throw new Error(`ring breaks: ${cycle[i].name} -> ${cycle[i].to}, expected ${next.name}`);
              }
            }
            console.log(`ring closes over ${cycle.length} states at ${m.tileSize}px, ${m.framesPerStrip} frames each`);
          '

      - name: Check every strip the manifest names exists
        run: |
          node --input-type=module -e '
            import { readFileSync, existsSync } from "node:fs";
            const m = JSON.parse(readFileSync("assets/manifest.json", "utf8"));
            const missing = m.cycle.map((s) => `assets/${s.strip}`).filter((p) => !existsSync(p));
            if (missing.length) throw new Error(`missing strips: ${missing.join(", ")}`);
            console.log(`all ${m.cycle.length} strips present`);
          '
