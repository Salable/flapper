name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests
    # The suite deliberately needs no browser and no display, so it runs on
    # Linux in seconds.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

  build:
    name: Web app builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # No Redis in CI: the build must succeed with the MemoryBroker fallback,
      # because that is also what `next dev` runs with.
      - run: npm run build

  assets:
    name: Tile art is reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # public/assets/ is committed so a clone runs with no build step. That
      # only stays true if the manifest keeps matching what the app expects, so
      # check the shape rather than trusting it.
      - name: Check the manifest describes a closed ring
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const m = JSON.parse(readFileSync("public/assets/manifest.json", "utf8"));
            const { cycle } = m;
            if (!Array.isArray(cycle) || cycle.length === 0) throw new Error("empty cycle");
            const names = cycle.map((s) => s.name);
            const seen = new Set(names);
            if (seen.size !== names.length) throw new Error("duplicate states in the ring");
            for (let i = 0; i < cycle.length; i += 1) {
              const next = cycle[(i + 1) % cycle.length];
              if (cycle[i].to !== next.name) {
                throw new Error(`ring breaks: ${cycle[i].name} -> ${cycle[i].to}, expected ${next.name}`);
              }
            }
            console.log(`ring closes over ${cycle.length} states at ${m.tileSize}px, ${m.framesPerStrip} frames each`);
          '

      - name: Check every strip the manifest names exists
        run: |
          node --input-type=module -e '
            import { readFileSync, existsSync } from "node:fs";
            const m = JSON.parse(readFileSync("public/assets/manifest.json", "utf8"));
            const missing = m.cycle.map((s) => `public/assets/${s.strip}`).filter((p) => !existsSync(p));
            if (missing.length) throw new Error(`missing strips: ${missing.join(", ")}`);
            console.log(`all ${m.cycle.length} strips present`);
          '
