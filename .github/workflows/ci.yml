name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests
    # The suite deliberately needs no browser and no display, so it runs on
    # Linux in seconds.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      # The React side has no tests; strict TypeScript is its only net.
      - run: npm run typecheck

      # Dead code is a build failure: unused files, exports, and deps must be
      # clean (attic/ is deliberately ignored - see docs/attic/README.md).
      - run: npx knip

  build:
    name: Web app builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # No Redis in CI: the build must succeed with the MemoryBroker fallback,
      # because that is also what `next dev` runs with.
      - run: npm run build
