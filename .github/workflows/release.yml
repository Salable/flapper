name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release (e.g. v2.0.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build and publish the macOS shell
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # A release that fails its own test suite should never reach anyone. The
      # tests live with the web app at the repo root.
      - run: npm ci
      - run: npm test

      - name: Check the tag matches the shell version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          PKG="v$(node -p "require('./desktop/package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag $TAG does not match desktop/package.json $PKG" >&2
            exit 1
          fi
          echo "building $TAG"

      # Universal, so one download runs on both Apple Silicon and Intel. A build
      # that will not start is worse than a large one.
      - name: Package
        working-directory: desktop
        run: |
          npm ci
          npm run pack

      - name: Verify the bundle before publishing it
        run: |
          APP="desktop/dist/Flapper-darwin-universal/Flapper.app"
          codesign --verify --deep --strict "$APP"
          lipo -archs "$APP/Contents/MacOS/Flapper"
          ls -lh desktop/dist/*.zip

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          ZIP="desktop/dist/Flapper-${VERSION}-universal.zip"
          SHA=$(shasum -a 256 "$ZIP" | cut -d' ' -f1)
          SIZE=$(du -h "$ZIP" | cut -f1)

          cat > notes.md <<EOF
          The desktop shell for Flapper: a kiosk window on the web app that keeps
          the display awake and boots straight back to its board.

          ## Install

          Download \`$(basename "$ZIP")\` below, unzip, and drag **Flapper.app** to Applications.

          **macOS will refuse to open it the first time.** The app is ad-hoc signed —
          there is no Apple Developer ID on the build — so Gatekeeper blocks it with
          *"Apple could not verify Flapper is free of malware."* This is expected. Either:

          - **System Settings → Privacy & Security**, scroll to Security, find
            "Flapper was blocked", click **Open Anyway**, authenticate, then open it
            again. Once per machine.
          - Or in Terminal:
            \`\`\`
            xattr -dr com.apple.quarantine /Applications/Flapper.app
            \`\`\`

          ## Using it

          Flapper opens the board service; create a board (or open an existing one)
          and the app remembers it — next launch goes straight to the board. Point it
          somewhere else with \`FLAPPER_URL\` or \`--url=\`, and pass \`--kiosk\` for
          a wall installation.

          Press \`C\` on the board for the control panel; the Access section there has
          the REST API details. \`GET /api/boards/{id}/AGENTS.md\` on any board returns
          the full contract for driving it, written for an agent rather than a person.

          ## Details

          - Universal binary — Apple Silicon and Intel
          - \`$SIZE\` zipped
          - SHA-256: \`$SHA\`

          Zipped with \`ditto\`, which preserves the symlinks inside
          \`Electron Framework.framework\`. Re-zipping the .app with \`zip -r\` breaks
          them and invalidates the signature.
          EOF

          gh release create "$TAG" "$ZIP" \
            --title "Flapper $TAG" \
            --notes-file notes.md \
            --verify-tag
